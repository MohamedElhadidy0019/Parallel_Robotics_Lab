# Inspection settings for the real Steve: Neobotix MPO-700 + UR5e, no gripper, wrist D415.
# Differs from inspection_config.yaml only in names and the camera injection. Every number the
# planner reasons with is the same shape, so the sim and the robot run the same code.
#
# Values marked MEASURE are placeholders. Set them from the real cell before running with motion.

inspection:
  # -- Start pose, robot base frame -------------------------------------------
  # MEASURE. The Gazebo values assume a table 0.60 m to the robot's -y. Replace both with the
  # real cell's geometry before enabling motion.
  start_camera_position_base: [0.0, -0.26, 1.14]
  start_look_at_base: [0.0, -0.60, 0.80]

  # -- Camera ------------------------------------------------------------------
  # The calibrated D415 is not in the robot's URDF. handeye_file makes RosRobot add it as a link
  # on camera_mount_link for cuRobo and publish the same transform on TF, so nothing else needs to
  # publish it. Expects handeye_solve.py's format: translation_m and quaternion_xyzw, camera pose
  # in the mount link's frame. Copy it from the robot repo's nbv_scratch/ to this path.
  handeye_file: "/home/ws/nbv_scratch/handeye_result.json"
  camera_mount_link: "ur5etool0"
  camera_optical_frame: "nbv_camera_optical_frame"

  # The packaged config names its camera dummy_camera_link and aliases it to camera_link. On the
  # real URDF camera_link is the PAN-TILT camera, so without this the camera spheres would sit on
  # the wrong camera and the wrist D415 would be invisible to collision checking.
  link_aliases:
    dummy_camera_link: "nbv_camera_optical_frame"
  # D415 body, 99 x 23 x 20 mm, in the optical frame (+z forward, +x along the baseline, +y down).
  # The colour sensor is off the body centre and which side is unverified, so the row spans
  # +-0.1 m in x. The last sphere covers the bracket back to ur5etool0, which sits near
  # (0.035, 0, -0.066) here. Check them in Rerun on the first dry run: world/planned/collision_spheres.
  collision_sphere_overrides:
    dummy_camera_link:
      - {center: [-0.070, 0.0, -0.012], radius: 0.030}
      - {center: [-0.035, 0.0, -0.012], radius: 0.030}
      - {center: [0.000, 0.0, -0.012], radius: 0.030}
      - {center: [0.035, 0.0, -0.012], radius: 0.030}
      - {center: [0.070, 0.0, -0.012], radius: 0.030}
      - {center: [0.035, 0.0, -0.045], radius: 0.030}

  color_topic: "/d415_calib/d415_calib/color/image_raw"
  depth_topic: "/d415_calib/d415_calib/aligned_depth_to_color/image_raw"
  camera_info_topic: "/d415_calib/d415_calib/color/camera_info"
  camera_near: 0.1
  camera_far: 2.5

  # -- Frames -------------------------------------------------------------------
  # There is no world frame on the real robot; the TF root is odom, which drifts with wheel
  # odometry. base_link makes base_pose() the identity and every world-to-base conversion a
  # no-op, which is what a static inspection wants.
  world_frame: "base_link"
  table_frame: "table_frame"
  object_frame: "object_frame"

  # -- Controller ----------------------------------------------------------------
  # The e-series bringup runs the scaled controller. It stays INACTIVE until an External Control
  # program is running on the pendant.
  controller_action: "/scaled_joint_trajectory_controller/follow_joint_trajectory"
  joint_states_topic: "/joint_states"
  # Pendant speed slider, in percent. Execution timeouts stretch with it instead of cancelling a
  # slowed-down move halfway.
  speed_scaling_topic: "/speed_scaling_state_broadcaster/speed_scaling"

  # -- Table ---------------------------------------------------------------------
  # MEASURE. Published as a static TF by the launch file, since nothing on the real robot
  # publishes table_frame.
  table_height: 0.70
  table_thickness: 0.04
  table_depth: 0.50
  table_width: 0.80

  # -- Planning --------------------------------------------------------------------
  max_reach: 0.85
  # Uniform slow-down of every planned trajectory. 0.1 turns a 100 degree start pose move into about
  # 6 s. The dry run prints the resulting peak joint speed; raise this once the first runs look right.
  speed_scale: 0.1
  waypoint_dt: 0.08
  settle_time_sec: 0.5
  frame_timeout: 30.0

  # No gripper is fitted, so the packaged Robotiq spheres drop out on their own. The cabinet refit
  # needs the cabinet mesh, which the real URDF takes from package://steve_simulation. That package
  # is not in this container, so the refit is skipped and the packaged cabinet spheres are used.
  refit_collision_links: ["cabinet_link"]
